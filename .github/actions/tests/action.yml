name: Tests
description: Steps for running tests in CI workflows

runs:
  using: "composite"
  steps:
    # Run all tests with coverage collection
    - name: Run Tests & Generate Coverage
      run: |
        dotnet test forge/Forge.sln \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./test-results \
          --logger trx \
          --logger "console;verbosity=detailed" \
          --verbosity normal
      shell: bash

    # Publish test results inline in GitHub
    - name: Publish Test Results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always()
      with:
        name: 'Test Results'
        path: './test-results/**/*.trx'
        reporter: 'dotnet-trx'
        fail-on-error: true

    # Generate and display coverage report inline
    - name: Generate Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # 5.5.12
      with:
        reports: './test-results/**/coverage.cobertura.xml'
        targetdir: './coverage-report'
        reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'
        sourcedirs: './forge'
        title: 'Code Coverage Report'

    # Add coverage summary to PR and workflow summary
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: './coverage-report/SummaryGithub.md'

    # Upload detailed coverage report as artifact (optional)
    - name: Upload Detailed Coverage Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html-report
        path: './coverage-report'
        retention-days: 30
      if: always()