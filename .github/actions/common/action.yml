
# .github/actions/common/action.yml (composite action)
#
# Shared Build Setup: Provides common steps for Docker/Nuke builds in CI workflows.
#
# Steps included:
#   - Set up Docker Buildx for advanced Docker builds
#   - Install .NET SDK 8.x for building .NET projects
#   - Install global .NET tools: GitVersion.Tool and Nuke.GlobalTool, at the versions the Dockerfile
#     pins (ARG GITVERSION_VERSION and ARG NUKE_VERSION); keep them equal
#
# Usage:
#   - Reference this action in your workflow with:
#       uses: ./.github/actions/common
#   - Place a checkout step before this action in your workflow.

name: Shared Build Setup
description: Common steps for Docker/Nuke builds

runs:
  using: "composite"
  steps:
    # Buildx switches --load to the OCI exporter with the containerd image store. That
    # exporter omits containerimage.config.digest, which the release claim requires.
    # Keep this explicit on disposable hosted Linux runners rather than substituting
    # a manifest digest for the configuration digest.
    - name: Select Classic Docker Image Store
      shell: bash
      run: |
        daemon_config=/etc/docker/daemon.json
        if [ -f "$daemon_config" ]; then
          jq '.features["containerd-snapshotter"] = false' "$daemon_config" > "$RUNNER_TEMP/docker-daemon.json"
        else
          printf '{"features":{"containerd-snapshotter":false}}\n' > "$RUNNER_TEMP/docker-daemon.json"
        fi
        sudo install -m 0644 "$RUNNER_TEMP/docker-daemon.json" "$daemon_config"
        sudo systemctl restart docker

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.x

    - name: Install .NET Tools
      run: |
        dotnet tool install --global GitVersion.Tool --version 6.5.1
        dotnet tool install --global Nuke.GlobalTool --version 10.1.0
      shell: bash
