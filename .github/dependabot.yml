# Dependabot — weekly, grouped update pull requests.
#
#   - github-actions: the SHA pins in .github/workflows and the composite actions in
#     .github/actions (Dependabot keeps the trailing version comment in step).
#   - nuget: the forge solution's package references.
#
# The Docker base image is not tracked here: it is passed as a build argument, not a FROM literal.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /forge
    # Microsoft.Extensions 11 drops net8.0 support; keep servicing the compatible line.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">=11.0.0"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      nuget:
        patterns:
          - "*"
