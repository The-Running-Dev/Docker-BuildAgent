# Manual Release Workflow
#
# Creates an official release from the commit it is dispatched on. The version always comes
# from GitVersion; a manually supplied version is not honoured yet (design/00-brief.md,
# I5), so the `version` input fails the run rather than being silently ignored.
#
# Usage:
#   1. Go to the Actions tab in GitHub
#   2. Select the "Release" workflow
#   3. Click "Run workflow", optionally ticking "Mark as Pre-Release"
#
# The workflow will:
#   - Run the module tests and every forge test project
#   - Build and publish the Docker image (latest and the GitVersion version tag)
#   - Create a GitHub release with an auto-generated changelog
#   - Tag the repository with the version number
#   - Dispatch the Update-Documentation event

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Not supported yet: any value fails the run. Leave empty; the version comes from GitVersion'
        required: false
        type: string
      prerelease:
        description: 'Mark as Pre-Release'
        required: false
        type: boolean
        default: false

permissions:
  packages: write
  contents: write
  checks: write
  pull-requests: write

# I13/S3.11: one CI concurrency group spans every publishing workflow (Build, Release,
# Release-from-Tag) so at most one run publishes at a time. cancel-in-progress: false means a
# publish already in flight always finishes, never pre-empted. GitHub holds at most ONE pending
# run per group, though: a newer run cancels the older pending one, so a queued release can be
# superseded and must then be re-dispatched.
concurrency:
  group: buildagent-publish
  cancel-in-progress: false

jobs:
  ModuleTests:
    name: Module Tests
    uses: ./.github/workflows/module-tests.yml

  Release:
    needs: ModuleTests
    name: Release
    runs-on: ubuntu-latest
    
    steps:
      # Checkout with full history for GitVersion and submodules (the Dockerfile copies docs-template/)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Setup build environment
      - name: Setup Environment
        uses: ./.github/actions/common

      # Run tests to ensure quality
      - name: Tests & Coverage
        uses: ./.github/actions/tests

      # A manual version is not honoured by the build (Version always comes from GitVersion),
      # so refuse it instead of publishing a different version than the operator asked for.
      - name: Reject Unsupported Version Input
        if: ${{ github.event.inputs.version != '' }}
        run: |
          echo "::error::The version input is not supported yet; the release version comes from GitVersion. Re-run with it empty, or push a version tag to use Release-from-Tag."
          exit 1

      # Build and create release
      - name: Build and Create Release
        run: nuke --type docker --create-github-release true --pre-release "${{ github.event.inputs.prerelease }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

      # Trigger documentation build if needed
      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Update-Documentation
