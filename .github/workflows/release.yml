# Manual Release Workflow
#
# Releases the commit it is dispatched on through forge/Publish (design/10-design.md, control
# flow 2). The version's core always comes from GitVersion; a manually supplied version is not
# honoured (I5), so the `version` input fails the run rather than being silently ignored. A
# pre-release label (letters and digits, e.g. rc1) makes the release 2.1.0-rc1: published to
# every sink and marked as a pre-release on GitHub, and it never moves the image's `latest`.
#
# Usage:
#   1. Go to the Actions tab in GitHub
#   2. Select the "Release" workflow
#   3. Click "Run workflow", optionally giving a pre-release label
#
# The workflow will:
#   - Run the module tests and every forge test project
#   - Refuse a version that is taken, a lower major, or a breaking surface change without a major
#   - Build the image, the BuildAgent.Tool package and the Docker-BuildAgent module package
#   - Publish them to ghcr.io, nuget.org and the PowerShell Gallery, then the GitHub release and tag
#   - Move the image's `latest` when this is the highest stable release
#   - Dispatch the Update-Documentation event
#
# Secrets: REGISTRY_TOKEN, NUGET_API_KEY, PSGALLERY_API_KEY (in the `release` environment or the
# repository). A failed run is resumed by re-running it for the same commit.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Not supported: any value fails the run. Leave empty; the version comes from GitVersion'
        required: false
        type: string
      prerelease-label:
        description: 'Pre-release label, letters and digits only (e.g. rc1). Leave empty for a stable release'
        required: false
        type: string

permissions:
  packages: write
  contents: write
  checks: write

# I13/S3.11: one CI concurrency group spans every publishing workflow (Build, Release,
# Release-from-Tag) so at most one run publishes at a time. cancel-in-progress: false means a
# publish already in flight always finishes, never pre-empted. GitHub holds at most ONE pending
# run per group, though: a newer run cancels the older pending one, so a queued release can be
# superseded and must then be re-dispatched.
concurrency:
  group: buildagent-publish
  cancel-in-progress: false

jobs:
  ModuleTests:
    name: Module Tests
    uses: ./.github/workflows/module-tests.yml

  Release:
    needs: ModuleTests
    name: Release
    runs-on: ubuntu-latest
    environment: release

    steps:
      # Full history for GitVersion and the previous release tag; submodules because the
      # Dockerfile copies docs-template/
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/common

      - name: Tests & Coverage
        uses: ./.github/actions/tests

      # A manual version is never honoured (the core comes from GitVersion), so refuse it instead
      # of publishing a different version than the operator asked for.
      - name: Reject Unsupported Version Input
        if: ${{ github.event.inputs.version != '' }}
        run: |
          echo "::error::The version input is not supported; the release version comes from GitVersion. Re-run with it empty, or push a version tag to use Release-from-Tag."
          exit 1

      - name: Publish Release
        uses: ./.github/actions/publish-release
        with:
          label: ${{ github.event.inputs.prerelease-label }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}
          psgallery-api-key: ${{ secrets.PSGALLERY_API_KEY }}

      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Update-Documentation
