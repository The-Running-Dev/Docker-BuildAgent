
# Documentation Deployment Workflow
#
# This workflow builds documentation and deploys it to GitHub Pages.
# The documentation is generated directly from the docs-template workspace,
# then uploaded and deployed to GitHub Pages.
#
# Workflow Configuration:
#   - Name: Docs
#   - Triggers:
#     * Manual dispatch (workflow_dispatch) for on-demand documentation builds
#     * Automatic trigger on push to main/default branch
#   - Permissions: pages:write, id-token:write
#
# Build Process:
#   1. Checkout repository
#   2. Initialize/update docs-template via existing setup script
#   3. Install docs dependencies and build docs-template directly
#   4. Upload generated static files from `docs-template/artifacts`
#   5. Deploy artifact to GitHub Pages
#
# Benefits:
#   - Avoids dependency on a prebuilt build-agent image
#   - Uses the latest checked-out docs-template submodule content
#   - Public access via GitHub Pages
#
name: Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs-template'
      - 'docs-template/**'
      - 'documentation/**'
      - 'scripts/setup-docs-submodule.ps1'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs-template'
      - 'docs-template/**'
      - 'documentation/**'
      - 'scripts/setup-docs-submodule.ps1'

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  Build-and-Deploy:
    name: Build Docs & Deploy to Pages
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs-template/pnpm-lock.yaml

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # Build documentation directly from the docs-template workspace
      - name: Build Documentation Site
        run: |
          pnpm --dir docs-template install --frozen-lockfile
          pnpm --dir docs-template build

      # Upload the documentation artifact for GitHub Pages
      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-template/artifacts

  # Deploy the uploaded artifact to GitHub Pages
  Deploy:
    name: Deploy to GitHub Pages
    needs: Build-and-Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4