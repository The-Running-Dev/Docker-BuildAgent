
# Documentation Deployment Workflow
#
# This workflow builds documentation and deploys it to GitHub Pages.
# The documentation is generated using the Build Agent container in the checked-out workspace,
# then uploaded and deployed to GitHub Pages.
#
# Workflow Configuration:
#   - Name: Docs
#   - Triggers:
#     * Manual dispatch (workflow_dispatch) for on-demand documentation builds
#     * Automatic trigger on push to main/default branch
#   - Permissions: pages:write, id-token:write
#
# Build Process:
#   1. Checkout repository with submodules
#   2. Build docs using `build node-template` in the build-agent container
#   3. Upload generated static files from `documentation/build`
#   4. Deploy artifact to GitHub Pages
#
# Benefits:
#   - Uses the same build tooling as CI/CD and local builds
#   - Avoids image-internal path coupling for docs output
#   - Public access via GitHub Pages
#
name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs-template/**'
      - 'documentation/**'
      - 'Dockerfile'
      - 'scripts/setup-docs-submodule.ps1'

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  Build-and-Deploy:
    name: Build Docs & Deploy to Pages
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository with submodules
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Build documentation in a containerized build-agent environment
      - name: Build Documentation Site
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ghcr.io/the-running-dev/build-agent:latest \
            build node-template -AppDir documentation

      # Upload the documentation artifact for GitHub Pages
      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build

  # Deploy the uploaded artifact to GitHub Pages
  Deploy:
    name: Deploy to GitHub Pages
    needs: Build-and-Deploy
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4