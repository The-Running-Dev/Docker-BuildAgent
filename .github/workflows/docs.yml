
# Documentation Deployment Workflow
#
# This workflow builds documentation and deploys it to GitHub Pages.
# The documentation is built as part of the Docker image build process,
# then extracted and published to GitHub Pages.
#
# Workflow Configuration:
#   - Name: Docs
#   - Triggers:
#     * Manual dispatch (workflow_dispatch) for on-demand documentation builds
#     * Automatic trigger on push to main/default branch
#   - Permissions: pages:write, id-token:write
#
# Build Process:
#   1. Checkout repository with submodules
#   2. Build Docker image (includes documentation build)
#   3. Extract built documentation from image
#   4. Upload documentation to GitHub Pages artifact
#   5. Deploy artifact to GitHub Pages
#
# Benefits:
#   - Documentation version matches image version
#   - Single source of truth for docs in docker-agent
#   - Public access via GitHub Pages
#   - Documentation accessible via `docker run` with built-in dev server
#
name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs-template/**'
      - 'documentation/**'
      - 'Dockerfile'
      - 'scripts/setup-docs-submodule.ps1'

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  Build-and-Deploy:
    name: Build Docs & Deploy to Pages
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository with submodules
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Build the Docker image (includes documentation build)
      - name: Build Docker Image
        run: |
          docker build \
            --tag build-agent:docs-build \
            --label "docs-build=$(date +%s)" \
            .

      # Extract built documentation from the image
      - name: Extract Documentation from Image
        run: |
          mkdir -p ./docs-output
          docker run --rm \
            -v ./docs-output:/output \
            build-agent:docs-build \
            bash -c "cp -r /app/docs-template/build/* /output/"

      # Upload the documentation artifact for GitHub Pages
      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-output

  # Deploy the uploaded artifact to GitHub Pages
  Deploy:
    name: Deploy to GitHub Pages
    needs: Build-and-Deploy
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4