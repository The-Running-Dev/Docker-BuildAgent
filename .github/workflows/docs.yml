
# Documentation Deployment Workflow
#
# This workflow builds documentation and deploys it to GitHub Pages.
# The documentation is generated directly from the docs-template workspace,
# then uploaded and deployed to GitHub Pages.
#
# Workflow Configuration:
#   - Name: Docs
#   - Triggers:
#     * Manual dispatch (workflow_dispatch) for on-demand documentation builds
#     * Repository dispatch of type Update-Documentation (sent by build.yml, release.yml
#       and release-tag.yml)
#     * Push to main that changes docs-template, documentation/** or
#       scripts/setup-docs-submodule.ps1
#   - Permissions: pages:write, id-token:write
#
# Build Process:
#   1. Check: DocsCheck, the site home page check and the parameter tables check; a failure stops
#      the deployment
#   2. Checkout repository (with submodules)
#   3. Install docs dependencies and build docs-template directly
#   4. Upload generated static files from `docs-template/artifacts`
#   5. Deploy artifact to GitHub Pages
#
# Benefits:
#   - Avoids dependency on a prebuilt build-agent image
#   - Uses the latest checked-out docs-template submodule content
#   - Public access via GitHub Pages
#
name: Docs

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - Update-Documentation
  push:
    branches:
      - main
    paths:
      - 'docs-template'
      - 'docs-template/**'
      - 'documentation/**'
      - 'scripts/setup-docs-submodule.ps1'

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  # The same documentation checks CI runs on a pull request, so a manual or dispatched run cannot
  # publish a site whose pages name things the repository lacks.
  Check:
    name: Docs Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.x

      - name: Check Documentation Names
        run: dotnet run --project forge/DocsCheck -c Release -- .

      - name: Check Site Home Page Matches README
        run: pwsh scripts/sync-site-home.ps1 -Check

      - name: Check Parameter Tables Match Sources
        run: pwsh scripts/Update-ParameterDocs.ps1 -Check

  Build-and-Deploy:
    name: Build Docs & Deploy to Pages
    needs: Check
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # Keep this version equal to ARG PNPM_VERSION in the Dockerfile, so CI builds the site the
      # way the image does.
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.0 --activate

      # Build documentation directly from the docs-template workspace
      - name: Build Documentation Site
        run: |
          pnpm --dir docs-template install --frozen-lockfile
          pnpm --dir docs-template build

      # Upload the documentation artifact for GitHub Pages
      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-template/artifacts

  # Deploy the uploaded artifact to GitHub Pages
  Deploy:
    name: Deploy to GitHub Pages
    needs: Build-and-Deploy
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5