
# Continuous Integration Workflow
#
# Validates a change before it is merged. It never publishes anything.
#
# Triggers:
#   - Pull requests (any target branch)
#   - Manual dispatch (workflow_dispatch)
#   It does not run on pushes to feature branches: open a pull request, or dispatch it by hand.
#   There is no path filter, so documentation-only changes run it too.
#
# Jobs:
#   - ModuleTests: calls module-tests.yml (Pester on Windows PowerShell 5.1 and PowerShell 7).
#   - DocsCheck: runs forge/DocsCheck, the site home page check and the parameter tables check; fails
#     the pull request when a document names something the repository does not have, the home page
#     has drifted from README.md, or parameters.md has drifted from the *Params classes.
#   - Build ("Build & Validate"): runs after ModuleTests.
#       1. Checks out the repository with full history and submodules
#       2. Runs the shared setup action (.github/actions/common)
#       3. Runs every test project in forge/Forge.sln with coverage (.github/actions/tests): test
#          results as a check run, a coverage summary as a sticky pull request comment, and the
#          coverage report as a workflow artifact
#       4. Dry-runs the Docker build (nuke --type docker --dry-run true), which builds the image
#          without pushing it
#       5. Scans that image for known vulnerabilities and reports them in the log (not yet a gate)
#       6. Builds the documentation site from docs-template without deploying it
#
# Concurrency: a newer run for the same pull request (or ref) cancels the one in progress.
#
# Environment (Build job, dry-run step):
#   - GITHUB_TOKEN, RegistryToken, NotificationsWebHookUrl
#
# Permissions: contents:read, checks:write (test results), pull-requests:write (coverage comment)
#
# Publishing is done by build.yml (a push to main) and by release.yml and release-tag.yml
# (releases); see documentation/docs/ci-cd.md and documentation/docs/releases.md.
#
name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ModuleTests:
    name: Module Tests
    uses: ./.github/workflows/module-tests.yml

  DocsCheck:
    name: Docs Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x

      # Fails the pull request when a document names a path, command, parameter, build type or
      # discovery location the tree and surface manifest lack, or breaks the canonical-contract rules.
      - name: Check Documentation Names
        run: dotnet run --project forge/DocsCheck -c Release -- .

      # The site home page is generated from README.md; fails when the two have drifted apart.
      - name: Check Site Home Page Matches README
        run: pwsh scripts/sync-site-home.ps1 -Check

      # parameters.md tables are generated from the *Params classes; fails when they have drifted.
      - name: Check Parameter Tables Match Sources
        run: pwsh scripts/Update-ParameterDocs.ps1 -Check

  Build:
    needs: ModuleTests
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository with full git history for GitVersion
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      # Execute shared setup steps (Docker, .NET, GitVersion, etc.)
      - name: Setup Environment
        uses: ./.github/actions/common

      # Execute tests steps
      - name: Tests & Coverage
        uses: ./.github/actions/tests

      # The global tool packs, installs and answers as `build-agent` (contract § Global tool).
      # 0.0.0-ci is a throwaway version: nothing here publishes.
      - name: Pack Global Tool
        run: |
          dotnet pack forge/Tool -c Release -p:ReleaseVersion=0.0.0-ci -o "$RUNNER_TEMP/tool"
          dotnet tool install BuildAgent.Tool --tool-path "$RUNNER_TEMP/tool-bin" --add-source "$RUNNER_TEMP/tool" --version 0.0.0-ci
          if "$RUNNER_TEMP/tool-bin/build-agent" 2> "$RUNNER_TEMP/usage.txt"; then
            echo "::error::build-agent with no arguments should exit non-zero with its usage."
            exit 1
          fi
          grep -q '^Usage: build-agent update' "$RUNNER_TEMP/usage.txt"

      # Run the Docker build in dry-run mode for validation
      - name: Validate Build
        run: nuke --type docker --dry-run true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

      # The dry run builds the image but does not push it; find it by the source label the
      # Dockerfile sets, which the base image does not carry.
      - name: Find Built Image
        id: image
        run: |
          image=$(docker image ls \
            --filter "label=org.opencontainers.image.source=https://github.com/The-Running-Dev/Docker-BuildAgent" \
            --format '{{.Repository}}:{{.Tag}}' | head -n 1)
          if [ -z "$image" ]; then
            echo "::error::The dry run built no image to scan."
            exit 1
          fi
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      # Reports the vulnerabilities that have a fix available; the table is in the log. Not a gate
      # yet: the image currently carries fixable critical findings (base-image perl, node packages),
      # so fail-build would block every pull request until they are remediated.
      - name: Scan Image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.ref }}
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # Validate docs-template build on pull requests (no deploy)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Keep this version equal to ARG PNPM_VERSION in the Dockerfile, so CI builds the site the
      # way the image does.
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.0 --activate

      - name: Validate Docs Build
        run: |
          pnpm --dir docs-template install --frozen-lockfile
          pnpm --dir docs-template build