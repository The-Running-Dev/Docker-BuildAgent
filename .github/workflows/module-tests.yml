# PowerShell Module Tests
#
# Runs the Docker-BuildAgent module's Pester tests on Windows PowerShell 5.1 and PowerShell 7.
# Both are gates, not best effort: CI and both release workflows call this and depend on it.
# `docker` is mocked, so a Windows runner (which cannot run Linux containers) is sufficient.

name: Module Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  Pester:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Module Tests
        run: |
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path scripts/powershell-module/Docker-BuildAgent.Tests.ps1 -CI -Output Detailed
