
# Build Workflow
#
# Builds and publishes the `latest` Docker image on every push to main. It writes no versioned
# tag, no GitHub release and no git tag: a push to main moves `latest` and nothing else
# (design/20-contract.md I15). Versioned images and releases come only from release.yml and
# release-tag.yml.
#
# Triggers:
#   - Push to main, unless the push changes only documentation/** and .github/**
#   - Manual dispatch (workflow_dispatch): runs the tests and the dry run, never publishes
#
# Steps:
#   1. Check out the repository with full history and submodules
#   2. Run the shared setup action (.github/actions/common)
#   3. Run every test project in forge/Forge.sln with coverage (.github/actions/tests)
#   4. Dry-run the Docker build (nuke --type docker --dry-run true)
#   5. On a push to main only: build and push the image (nuke --type docker --create-github-release false)
#   6. On a push to main only: if the commit changed files under documentation/, dispatch
#      Update-Documentation, which docs.yml listens for
#
# Concurrency: shares the buildagent-publish group with release.yml and release-tag.yml, so only
# one publisher runs at a time (see the concurrency block below).
#
# Environment: GITHUB_TOKEN, RegistryToken, NotificationsWebHookUrl (Discord notification, optional)
# Permissions: packages:write, contents:write, checks:write
#
name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'documentation/**'
      - '.github/**'

permissions:
  packages: write
  contents: write
  checks: write

# I13/S3.11: one CI concurrency group spans every publishing workflow (Build, Release,
# Release-from-Tag) so at most one run publishes at a time. cancel-in-progress: false means a
# publish already in flight always finishes, never pre-empted. GitHub holds at most ONE pending
# run per group, though: a newer run cancels the older pending one, so a queued release can be
# superseded and must then be re-dispatched.
concurrency:
  group: buildagent-publish
  cancel-in-progress: false

jobs:
  Build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository with full git history for GitVersion and changelog generation
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      # Execute shared setup steps (Docker, .NET, GitVersion, etc.)
      - name: Setup Environment
        uses: ./.github/actions/common

      # Execute tests steps
      - name: Tests & Coverage
        uses: ./.github/actions/tests

      # Validate build on main push (keeps notification path before publish)
      - name: Validate Build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: nuke --type docker --dry-run true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

      # Build and Publish (main branch push only)
      - name: Build and Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nuke --type docker --create-github-release false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

      # Check if documentation files were modified in this commit
      - name: Check for Documentation Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: docs-changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^documentation/'; then
            echo "Documentation changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No documentation changes found"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Trigger documentation site rebuild if docs were updated
      - name: Trigger Documentation Build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.docs-changed.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Update-Documentation