# Tag-Based Release Workflow
#
# Releases the commit a pushed version tag points at, through forge/Publish (design/10-design.md,
# control flow 2). The tag names the version, so it must be one GitVersion would accept and that
# no other commit or release holds; a tag with nothing else holding its version is a release this
# run makes from that tag (I5).
#
# Usage:
#   1. Create and push a tag: git tag v2.1.0 && git push origin v2.1.0
#   2. The workflow will run and publish the release
#
# Tag Format:
#   - v<MAJOR>.<MINOR>.<PATCH>, optionally with a pre-release label of letters and digits:
#     v2.1.0-rc1. A pre-release is published to every sink and marked as a pre-release on
#     GitHub, and it never moves the image's `latest`. Dotted or hyphenated labels (v2.1.0-rc.1)
#     are refused: the PowerShell Gallery cannot hold them.
#
# Secrets: REGISTRY_TOKEN, NUGET_API_KEY, PSGALLERY_API_KEY (in the `release` environment or the
# repository). A failed run is resumed by re-running it.

name: Release-from-Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: write
  checks: write

# I13/S3.11: one CI concurrency group spans every publishing workflow (Build, Release,
# Release-from-Tag) so at most one run publishes at a time. cancel-in-progress: false means a
# publish already in flight always finishes, never pre-empted. GitHub holds at most ONE pending
# run per group, though: a newer run cancels the older pending one, so a queued release can be
# superseded and must then be re-dispatched.
concurrency:
  group: buildagent-publish
  cancel-in-progress: false

jobs:
  ModuleTests:
    name: Module Tests
    uses: ./.github/workflows/module-tests.yml

  Release:
    needs: ModuleTests
    name: Release from Tag
    runs-on: ubuntu-latest
    environment: release

    steps:
      # Full history for the previous release tag; submodules because the Dockerfile copies
      # docs-template/
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/common

      - name: Tests & Coverage
        uses: ./.github/actions/tests

      - name: Publish Release
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}
          psgallery-api-key: ${{ secrets.PSGALLERY_API_KEY }}

      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Update-Documentation
