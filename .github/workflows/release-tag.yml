# Tag-Based Release Workflow
#
# This workflow creates releases when you push a version tag to the repository.
# This is useful if you prefer to create releases by pushing tags rather than
# using the manual workflow dispatch method.
#
# Usage:
#   1. Create and push a tag: git tag v1.2.3 && git push origin v1.2.3
#   2. The workflow will automatically run and create a release
#
# Tag Format:
#   - Use semantic versioning: v1.2.3, v1.0.0-beta.1, etc.
#   - Must start with 'v' (configured in GitVersion.yml)

name: Release-from-Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: write
  checks: write

# I13/S3.11: one CI concurrency group spans every publishing workflow (Build, Release,
# Release-from-Tag) so at most one run publishes at a time. cancel-in-progress: false means a
# publish already in flight always finishes, never pre-empted. GitHub holds at most ONE pending
# run per group, though: a newer run cancels the older pending one, so a queued release can be
# superseded and must then be re-dispatched.
concurrency:
  group: buildagent-publish
  cancel-in-progress: false

jobs:
  ModuleTests:
    name: Module Tests
    uses: ./.github/workflows/module-tests.yml

  Release:
    needs: ModuleTests
    name: Release from Tag
    runs-on: ubuntu-latest
    
    steps:
      # Checkout with full history and submodules (the Dockerfile copies docs-template/)
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      # Setup build environment
      - name: Setup Environment
        uses: ./.github/actions/common

      # Run tests
      - name: Tests & Coverage
        uses: ./.github/actions/tests

      # Determine if this is a prerelease
      - name: Check if Pre-Release
        id: prerelease
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ -[a-zA-Z] ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Build and create release
      - name: Build and Create Release
        run: nuke --type docker --create-github-release true --pre-release "${{ steps.prerelease.outputs.prerelease }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RegistryToken: ${{ secrets.REGISTRY_TOKEN }}
          NotificationsWebHookUrl: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}

      # Trigger documentation build
      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Update-Documentation
